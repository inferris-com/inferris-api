name: OpenAPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-openapi.ts"
      - "src/**/*.ts"

permissions:
  contents: write

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI spec
        run: npm run generate:openapi

      - name: Commit generated spec
        run: |
          if git diff --quiet -- openapi.json openapi.yaml; then
            echo "OpenAPI spec is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json openapi.yaml
          git commit -m "chore: update openapi spec"
          git push
