    post:
      tags:
        - "Players"
      security:
        - bearerAuth:
            []
      summary: "Create a player"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                username:
                  type: "string"
                  minLength: 3
                  maxLength: 16
                  pattern: "^[a-zA-Z0-9_]+$"
                flags:
                  anyOf:
                    - type: "string"
                    - type: "number"
                    - type: "string"
                      pattern: "^d+$"
                  default: "0"
                orbs:
                  anyOf:
                    - type: "string"
                    - type: "number"
                    - type: "string"
                      pattern: "^d+$"
                chatChannel:
                  type: "string"
                  enum:
                    - "global"
                    - "staff"
                    - "testing"
                  default: "global"
              required:
                - "id"
                - "username"
              additionalProperties: false
